[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bio-mcp"
version = "0.1.0"
description = "MCP server for CZ CELLxGENE Census and BioGRID ORCS — expression by cell type, CRISPR screen hits, and the join between them."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Siavash Ghaffari" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    # >=2.0 because server.py uses mcp.server.mcpserver.MCPServer, the 2.x
    # replacement for the 1.x FastMCP class MVP.md/design.md refer to by
    # name — see server.py's module docstring.
    "mcp>=2.0",
    "httpx>=0.27",
    "pandas>=2.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
# Only needed to run the offline jobs in src/bio_mcp/precompute/. The server
# itself reads their output (parquet tables) and never imports this stack —
# see precompute/__init__.py. Deliberately kept out of core dependencies:
# cellxgene-census's native dependency (tiledbsoma) ships no Windows wheels,
# and requiring it would make bio-mcp itself Windows-incompatible for no
# runtime benefit.
precompute = [
    "cellxgene-census>=1.18.0",
]

[project.scripts]
bio-mcp = "bio_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Siavashghaffari/Bio-MCP"
Issues = "https://github.com/Siavashghaffari/Bio-MCP/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bio_mcp"]

# Apache-2.0 section 4(d): NOTICE must ship with every distribution.
# hatchling auto-detects LICENSE and NOTICE and copies both into the
# wheel's <dist-info>/licenses/ directory.

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    "/scope.md",
    "/design.md",
    "/MVP.md",
    "/manifest.json",
    "/mcpb_entry.py",
    "/.mcpbignore",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
