# Smithery deployment config — https://smithery.ai/docs
#
# bio-mcp speaks stdio (scope.md: no HTTP transport), so this uses the
# stdio startCommand form: Smithery runs `python -m bio_mcp` and pipes
# JSON-RPC over stdin/stdout.
#
# NOT YET VERIFIED on Smithery — bio-mcp isn't published and the Census
# data tables aren't hosted (Phase 4). Treat this as a starting point to
# test once those land; Smithery's schema also shifts, so check it against
# the current docs before submitting.

startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      orcsAccessKey:
        type: string
        title: BioGRID ORCS access key
        description: >-
          Optional. A free key from https://orcsws.thebiogrid.org/ enables
          the crispr_screen_hits and screens_in_cell_line tools. Every
          Census tool works without it.
  commandFunction: |-
    (config) => ({
      command: 'python',
      args: ['-m', 'bio_mcp'],
      env: config.orcsAccessKey ? { ORCS_ACCESS_KEY: config.orcsAccessKey } : {}
    })
