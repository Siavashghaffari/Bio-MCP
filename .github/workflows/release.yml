name: Release

# Publishes the Python distribution artifacts. Cut a release with:
#
#     git tag v0.1.2 && git push origin v0.1.2
#
# The Claude Desktop extension (bio-mcp.dxt) is deliberately NOT built here.
# It is a DXT 0.1 python extension that vendors its dependencies, so the
# artifact is tied to the platform and CPython minor version it was packed
# with - a Linux CI runner cannot produce the Windows/3.10 bundle that ships
# in this repo. It is built by hand and committed at the repo root instead;
# see "Rebuilding the extension" in the README.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      - name: Check the bundled gene-id table made it into the wheel
        run: python -c "import zipfile, glob; w = glob.glob('dist/*.whl')[0]; assert 'bio_mcp/data/human_gene_ids.parquet' in zipfile.ZipFile(w).namelist(), 'gene-id table missing from wheel'"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
