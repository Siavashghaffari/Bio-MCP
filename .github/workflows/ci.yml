name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install bio-mcp with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Offline tests (no network — see design.md section 6)
        run: pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Check the bundled gene-id table made it into the wheel
        run: python -c "import zipfile, glob; w = glob.glob('dist/*.whl')[0]; assert 'bio_mcp/data/human_gene_ids.parquet' in zipfile.ZipFile(w).namelist(), 'gene-id table missing from wheel'"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate the extension manifest
        run: |
          npm install -g @anthropic-ai/mcpb
          mcpb validate manifest.json

      - name: Check the committed extension bundle
        # bio-mcp.dxt is built by hand (it vendors platform-specific wheels, so
        # a Linux runner cannot rebuild it) and committed. CI verifies the
        # artifact in the repo is intact rather than repacking it.
        run: |
          python - <<'PY'
          import sys, zipfile, json
          from pathlib import Path

          bundle = Path("bio-mcp.dxt")
          if not bundle.exists():
              sys.exit("bio-mcp.dxt is missing from the repo")

          z = zipfile.ZipFile(bundle)
          names = z.namelist()
          manifest = json.loads(z.read("manifest.json"))

          if manifest.get("dxt_version") != "0.1":
              sys.exit("bundle manifest must declare dxt_version 0.1")
          if manifest["server"]["type"] != "python":
              sys.exit("bundle manifest must declare server.type python")
          if "mcpb_entry.py" not in names:
              sys.exit("mcpb_entry.py missing from the bundle")

          # `*.py[cod]` in .mcpbignore also matches `*.pyd` and would silently
          # strip every compiled wheel, leaving a bundle that dies on import.
          native = [n for n in names if n.endswith((".pyd", ".so", ".dylib"))]
          if not native:
              sys.exit("no native extensions in the bundle - it would fail on import")
          print(f"bio-mcp.dxt OK: {len(names)} files, {len(native)} native extensions")
          PY

      - name: Reject the *.py[cod] glob in .mcpbignore
        run: |
          if grep -qE '^\*\.py\[cod\]' .mcpbignore; then
            echo "::error::.mcpbignore must not use *.py[cod] - it also matches *.pyd"
            exit 1
          fi
