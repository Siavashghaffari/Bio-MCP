name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install bio-mcp with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Offline tests (no network — see design.md section 6)
        run: pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Check the bundled gene-id table made it into the wheel
        run: python -c "import zipfile, glob; w = glob.glob('dist/*.whl')[0]; assert 'bio_mcp/data/human_gene_ids.parquet' in zipfile.ZipFile(w).namelist(), 'gene-id table missing from wheel'"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate the MCPB extension manifest
        run: |
          npm install -g @anthropic-ai/mcpb
          mcpb validate manifest.json

      - name: Check the extension bundle's shape
        run: |
          mcpb pack . bio-mcp.mcpb
          python - <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile("bio-mcp.mcpb").namelist()
          for name in ("manifest.json", "pyproject.toml", "src/bio_mcp/__main__.py"):
              if name not in names:
                  sys.exit(f"missing from bundle: {name}")
          # A uv bundle must not vendor dependencies - compiled wheels are not
          # portable across platforms or Python versions.
          for bad in ("lib/", "venv/", ".venv/", ".claude/"):
              if any(n.startswith(bad) for n in names):
                  sys.exit(f"a uv bundle must not contain {bad}")
          print(f"bundle OK: {len(names)} files")
          PY
