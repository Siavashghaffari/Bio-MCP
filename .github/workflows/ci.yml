name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install bio-mcp with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Offline tests (no network — see design.md section 6)
        run: pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Check the bundled gene-id table made it into the wheel
        run: python -c "import zipfile, glob; w = glob.glob('dist/*.whl')[0]; assert 'bio_mcp/data/human_gene_ids.parquet' in zipfile.ZipFile(w).namelist(), 'gene-id table missing from wheel'"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate the extension manifest
        run: |
          npm install -g @anthropic-ai/mcpb
          mcpb validate manifest.json

      - name: Check the committed extension bundles
        # The .dxt files vendor platform-specific wheels, so a Linux runner
        # cannot rebuild them. CI verifies the committed artifacts are intact.
        run: |
          python - <<'PY'
          import json, sys, zipfile
          from pathlib import Path

          expected = {
              "bio-mcp-windows-x64.dxt": ".pyd",
              "bio-mcp-linux-x64.dxt": ".so",
              "bio-mcp-macos-arm64.dxt": ".so",
          }
          failures = []
          for filename, native_suffix in expected.items():
              path = Path(filename)
              if not path.exists():
                  failures.append(f"{filename}: missing from the repo")
                  continue
              archive = zipfile.ZipFile(path)
              names = archive.namelist()
              manifest = json.loads(archive.read("manifest.json"))

              if manifest.get("dxt_version") != "0.1":
                  failures.append(f"{filename}: manifest must declare dxt_version 0.1")
              if manifest["server"]["type"] != "python":
                  failures.append(f"{filename}: manifest must declare server.type python")
              if "mcpb_entry.py" not in names:
                  failures.append(f"{filename}: mcpb_entry.py missing")

              # `*.py[cod]` in .mcpbignore also matches `*.pyd` and would
              # silently strip every compiled wheel, leaving a dead bundle.
              native = [n for n in names if n.endswith(native_suffix)]
              if not native:
                  failures.append(f"{filename}: no {native_suffix} files - would fail on import")
              else:
                  print(f"{filename}: {len(names)} files, {len(native)} native")

          if failures:
              sys.exit("
".join(failures))
          print("all three bundles OK")
          PY

      - name: Reject the *.py[cod] glob in .mcpbignore
        run: |
          if grep -qE '^\*\.py\[cod\]' .mcpbignore; then
            echo "::error::.mcpbignore must not use *.py[cod] - it also matches *.pyd"
            exit 1
          fi
